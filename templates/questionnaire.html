{% extends "base.html" %}

{% block title %}Find Your Cat or Dog Match{% endblock %}

{% block content %}
<main class="quiz-page">
    <div class="container quiz-shell">
        <div class="quiz-panel">
            <header class="quiz-header">
                <p class="quiz-eyebrow"><i class="fas fa-paw" aria-hidden="true"></i> COLLARS, NOSES &amp; PAWS</p>
                <h1 id="quizTitle">Find Your Cat or Dog Match</h1>
                <p id="quizIntro">Choose a pet to begin.</p>
                <div id="quizProgress" class="quiz-progress" hidden>
                    <div class="quiz-progress-labels">
                        <span id="questionCount" aria-live="polite"></span>
                        <span>YOUR JOURNEY</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width: 0%"></div>
                    </div>
                </div>
            </header>
            <div class="quiz-body">
                <div id="speciesChoice" class="species-choice">
                    <button type="button" class="species-card species-card-cat" data-species="cat">
                        <span class="species-icon" aria-hidden="true"><i class="fas fa-cat"></i></span>
                        <span class="species-card-copy"><strong>Find My Cat Match</strong><span>For curious, cozy, and independent companions.</span></span>
                        <i class="fas fa-arrow-right species-arrow" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="species-card species-card-dog" data-species="dog">
                        <span class="species-icon" aria-hidden="true"><i class="fas fa-dog"></i></span>
                        <span class="species-card-copy"><strong>Find My Dog Match</strong><span>For playful, loyal, and adventurous companions.</span></span>
                        <i class="fas fa-arrow-right species-arrow" aria-hidden="true"></i>
                    </button>
                </div>
                <p id="quizStatus" class="quiz-status" role="status" aria-live="polite" hidden></p>
                <p id="quizError" class="quiz-error" role="alert" hidden></p>
                <form id="questionnaireForm" hidden>
                    <button type="button" class="quiz-back" id="changeSpeciesBtn"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Cat/Dog choice</button>
                    <div id="questionsContainer"></div>
                    <div class="quiz-actions">
                        <button type="button" class="btn quiz-prev" id="prevBtn" hidden><i class="fas fa-arrow-left" aria-hidden="true"></i> Previous</button>
                        <button type="button" class="btn quiz-next" id="nextBtn">Next <i class="fas fa-arrow-right" aria-hidden="true"></i></button>
                        <button type="submit" class="btn quiz-submit" id="submitBtn" hidden>Get My Match <i class="fas fa-paw" aria-hidden="true"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('questionnaireForm');
    const quizPage = document.querySelector('.quiz-page');
    const questionsContainer = document.getElementById('questionsContainer');
    const speciesChoice = document.getElementById('speciesChoice');
    const title = document.getElementById('quizTitle');
    const intro = document.getElementById('quizIntro');
    const error = document.getElementById('quizError');
    const status = document.getElementById('quizStatus');
    const progress = document.getElementById('quizProgress');
    const progressBar = progress.querySelector('.progress-bar');
    const questionCount = document.getElementById('questionCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const changeSpeciesBtn = document.getElementById('changeSpeciesBtn');
    const submissionToken = {{ submission_token|tojson }};
    let species = null;
    let questions = [];
    let answers = {};
    let currentIndex = 0;
    let submitting = false;

    function showError(message) {
        error.textContent = message;
        error.hidden = false;
    }

    function showQuestion() {
        questionsContainer.querySelectorAll('.question-container').forEach((item, index) => {
            item.classList.toggle('active', index === currentIndex);
        });
        prevBtn.hidden = currentIndex === 0;
        nextBtn.hidden = currentIndex === questions.length - 1;
        submitBtn.hidden = currentIndex !== questions.length - 1;
        const percent = Math.round((currentIndex + 1) / questions.length * 100);
        progressBar.style.width = percent + '%';
        progressBar.setAttribute('aria-valuenow', percent);
        questionCount.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    }

    function saveAnswer() {
        const question = questions[currentIndex];
        const selected = questionsContainer.querySelector(`input[name="${question.id}"]:checked`);
        if (selected) answers[question.id] = selected.value;
        return Boolean(selected);
    }

    async function chooseSpecies(chosen) {
        error.hidden = true;
        status.textContent = 'Loading your questions…';
        status.hidden = false;
        speciesChoice.querySelectorAll('[data-species]').forEach(button => { button.disabled = true; });
        try {
            const response = await fetch('/api/questionnaire?species=' + encodeURIComponent(chosen));
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Could not load questions.');
            species = chosen;
            quizPage.dataset.species = chosen;
            questions = data.questions;
            answers = data.current_answers || {};
            currentIndex = 0;
            questionsContainer.replaceChildren();
            questions.forEach((question, index) => {
                const fieldset = document.createElement('fieldset');
                fieldset.className = 'question-container';
                const legend = document.createElement('legend');
                legend.className = 'h4 mb-3';
                legend.textContent = `${index + 1}. ${question.question}`;
                fieldset.appendChild(legend);
                question.answers.forEach((answer, optionIndex) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'form-check answer-option';
                    const input = document.createElement('input');
                    input.className = 'form-check-input';
                    input.type = 'radio';
                    input.name = question.id;
                    input.id = `${question.id}a${optionIndex}`;
                    input.value = answer;
                    input.checked = answers[question.id] === answer;
                    const label = document.createElement('label');
                    label.className = 'form-check-label';
                    label.htmlFor = input.id;
                    label.textContent = answer;
                    wrapper.append(input, label);
                    fieldset.appendChild(wrapper);
                });
                questionsContainer.appendChild(fieldset);
            });
            title.textContent = `Find Your Perfect ${chosen === 'cat' ? 'Cat' : 'Dog'} Breed`;
            intro.textContent = 'Answer these questions to find a breed that fits your lifestyle.';
            speciesChoice.hidden = true;
            form.hidden = false;
            progress.hidden = false;
            showQuestion();
        } catch (err) {
            showError(err.message);
        } finally {
            status.hidden = true;
            speciesChoice.querySelectorAll('[data-species]').forEach(button => { button.disabled = false; });
        }
    }

    speciesChoice.querySelectorAll('[data-species]').forEach(button => {
        button.addEventListener('click', () => chooseSpecies(button.dataset.species));
    });
    changeSpeciesBtn.addEventListener('click', () => {
        species = null;
        delete quizPage.dataset.species;
        questions = [];
        answers = {};
        form.hidden = true;
        progress.hidden = true;
        speciesChoice.hidden = false;
        title.textContent = 'Find Your Cat or Dog Match';
        intro.textContent = 'Choose a pet to begin.';
        error.hidden = true;
        status.hidden = true;
    });
    prevBtn.addEventListener('click', () => {
        saveAnswer();
        if (currentIndex > 0) currentIndex--;
        showQuestion();
    });
    nextBtn.addEventListener('click', () => {
        if (!saveAnswer()) {
            showError('Please choose an answer before continuing.');
            return;
        }
        error.hidden = true;
        if (currentIndex < questions.length - 1) currentIndex++;
        showQuestion();
    });
    form.addEventListener('submit', async event => {
        event.preventDefault();
        if (submitting) return;
        saveAnswer();
        if (questions.some(question => !answers[question.id])) {
            showError('Please answer all 10 questions before submitting.');
            return;
        }
        submitting = true;
        submitBtn.disabled = true;
        submitBtn.setAttribute('aria-busy', 'true');
        status.textContent = 'Finding your match…';
        status.hidden = false;
        error.hidden = true;
        try {
            const response = await fetch('/questionnaire', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': {{ csrf_token()|tojson }}},
                body: JSON.stringify({species, answers, submission_token: submissionToken})
            });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.message || 'Could not save your match.');
            window.location.href = data.redirect;
        } catch (err) {
            showError(err.message);
            submitting = false;
            submitBtn.disabled = false;
            submitBtn.removeAttribute('aria-busy');
            status.hidden = true;
        }
    });
});
</script>
{% endblock %}
